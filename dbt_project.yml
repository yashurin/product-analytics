name: product_analytics
version: "1.0.0"
config-version: 2

# Local warehouse is DuckDB (profiles.yml → ./analytics.duckdb).
# To run the same models on Snowflake, add the snowflake output from the README
# and select it: dbt build --target snowflake --profiles-dir .
profile: product_analytics

model-paths: ["models"]
clean-targets:
  - target
  - dbt_packages

models:
  product_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
